services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: catan-prometheus
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  thinking-api:
    image: python:3.11-slim
    container_name: catan-thinking-api
    command: python /app/thinking_api.py --host 0.0.0.0 --port 8000
    volumes:
      - ./thinking_api.py:/app/thinking_api.py:ro
      - ./data:/app/data:ro
    working_dir: /app
    ports:
      - "8000:8000"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: catan-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/executor.json
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./data:/data:ro
    depends_on:
      - prometheus
      - thinking-api
